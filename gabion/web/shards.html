<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gabion shards — one llama, many tabs</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, Consolas, monospace; margin: 2rem auto; max-width: 860px;
         padding: 0 1rem; background: #101418; color: #d7dde4; }
  h1 { font-size: 1.2rem; color: #7fd1ff; }
  .bar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .6rem 0; }
  label { display: flex; gap: .4rem; align-items: center; font-size: .85rem; color: #9fb0bf; }
  input[type=text], textarea { background: #1a2028; color: #d7dde4; border: 1px solid #2d3748;
         border-radius: 6px; padding: .35rem .5rem; font: inherit; }
  textarea { width: 100%; height: 3.2rem; resize: vertical; }
  button { background: #1e6fd9; color: #fff; border: 0; border-radius: 6px; padding: .45rem 1.1rem;
         font: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: wait; }
  #status { font-size: .8rem; color: #7fd1ff; min-height: 1.1em; white-space: pre-wrap; }
  #shards { font-size: .75rem; color: #9fb0bf; }
  .ok { color: #8fd98f; } .err { color: #ff7d7d; }
  #output { white-space: pre-wrap; word-break: break-word; background: #161c24; border: 1px solid #2d3748;
         border-radius: 8px; padding: .9rem; min-height: 6rem; max-height: 24rem; overflow-y: auto; }
  #stats { font-size: .8rem; color: #8fd98f; }
</style>
</head>
<body>
<h1>gabion shards — qwen2.5-0.5b split across browser tabs</h1>
<div class="bar">
  <label>shards dir <input type="text" id="dir" value="/gabion/web/models/qwen2.5-0.5b-shards" style="width:22rem"></label>
  <label>tokens <input type="text" id="tokens" value="64" style="width:4rem"></label>
  <label>temp <input type="text" id="temp" value="0.7" style="width:4rem"></label>
  <label>top-k <input type="text" id="topk" value="40" style="width:4rem"></label>
  <label>top-p <input type="text" id="topp" value="0.9" style="width:4rem"></label>
  <label>parallel <input type="text" id="parallel" value="1" title="tokens per pipeline pass (K)" style="width:3rem"></label>
  <label>seed <input type="text" id="seed" value="" placeholder="random" style="width:6rem"></label>
</div>
<div class="bar">
  <label><input type="checkbox" id="chat" checked> chat format</label>
  <label><input type="checkbox" id="stop" checked> stop at &lt;|endoftext|&gt;/&lt;|im_end|&gt;</label>
  <button id="go">Spawn shards + Generate</button>
</div>
<div class="bar"><label>prompt</label>
  <textarea id="prompt">The capital of France is</textarea>
</div>
<div id="shards"><div style="color:#9fb0bf">no shard workers yet — click Generate to spawn them</div></div>
<div id="shardlog" style="font-size:.75rem;color:#9fb0bf;min-height:1.1em"></div>
<div id="status">booted — manifest will be fetched on Generate</div>
<div id="output">(generation appears here)</div>
<div id="stats"></div>
<pre id="resultJson" hidden>{}</pre>

<script src="/gabion/web/tinygrad_v0.js?v=16"></script>
<script src="/gabion/web/webgpu_backend.js?v=16"></script>
<script src="/gabion/web/tokenizer.js?v=16"></script>
<script src="/gabion/web/bbt_forward.js?v=16"></script>
<script src="/gabion/web/model_loader.js?v=16"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
// Coordinator-side GPU: only the lm_head matmul needs acceleration
// ([1,896]x[896,151936] ≈ 900ms CPU per token). Embedding lookup is trivial.
let coordGPU = null;
async function initCoordGPU() {
  if (coordGPU || !navigator.gpu) return coordGPU;
  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) return (coordGPU = false);
    // Default device limits cap maxBufferSize at 256MB — the embedding/head
    // buffers are 544MB, so request the adapter's full limits.
    const device = await adapter.requestDevice({
      requiredLimits: {
        maxBufferSize: adapter.limits.maxBufferSize,
        maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
      },
    });
    WebGPUBackend.init(device);
    for (const name of ["matmul", "embedding_forward"]) {
      const r = await fetch(`/gabion/web/kernels/${name}.wgsl`, { cache: "no-store" });
      if (r.ok) WebGPUBackend.registerShader(name, await r.text());
    }
    coordGPU = WebGPUBackend.instance;
  } catch (e) { coordGPU = false; }
  return coordGPU;
}
const out = { model: {}, shards: [], promptTokens: 0, generatedTokens: 0, text: "",
              tokPerSec: 0, ms: 0, stopped: false, error: null,
              stageMs: { load: 0, ready: 0, prefill: 0, decode: 0 },
              perTokenMs: [], hopMs: [], embedMs: [], headMs: [] };
let busy = false;

function status(s, cls) { $("status").textContent = s; $("status").className = cls || ""; }
function setResult() { $("resultJson").textContent = JSON.stringify(out); window.__demoResult = out; }

async function generate() {
  if (busy) return;
  busy = true; $("go").disabled = true;
  $("output").textContent = ""; $("stats").textContent = ""; $("shards").textContent = "";
  out.error = null;
  const t0 = performance.now();
  const chan = new BroadcastChannel("gabion-shards");
  const runId = Math.random().toString(36).slice(2, 10);
  const pending = new Map();
  let nextId = 1;
  chan.onmessage = (ev) => {
    const m = ev.data;
    if (m.run !== runId) return; // stale workers from earlier runs share the channel
    if (m.cmd === "result") { const p = pending.get(m.id); if (p) { pending.delete(m.id); p.resolve(m.rows); } }
    else if (m.cmd === "error") { const p = pending.get(m.id); if (p) { pending.delete(m.id); p.reject(new Error(m.error)); } }
  };
  const send = (shard, rows, id) => {
    chan.postMessage({ cmd: "prefill", run: runId, shard, id, rows }, [rows.buffer]);
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  };
  const pipeline = async (rows) => {
    const hopMs = [];
    let cur = rows;
    for (let i = 0; i < out.shards.length; i++) {
      const id = nextId++;
      const h0 = performance.now();
      cur = await send(i, cur, id);
      hopMs.push(performance.now() - h0);
    }
    return { rows: cur, hopMs };
  };

  try {
    const dir = $("dir").value.trim().replace(/\/$/, "");
    const tL0 = performance.now();
    const manifest = await gabionLoader.loadBBTShards(dir + "/model.json");
    const specs = manifest.shards.filter(Boolean);
    out.shards = specs;
    out.model = { n_layers: manifest.config.n_layers, d_model: manifest.config.d_model,
                  vocab: manifest.config.vocab_size, shard_count: specs.length };
    status(`manifest: ${out.model.n_layers} layers, ${specs.length} shard files — spawning tabs…`);
    // Spawn one worker per shard as a same-origin iframe (separate browsing
    // context — BroadcastChannel reaches it; window.open popups are unreliable
    // in headless Chrome without a user gesture).
    for (let i = 0; i < specs.length; i++) {
      const f = document.createElement("iframe");
      f.src = `/gabion/web/shard_worker.html?shard=${i}&run=${runId}&dir=${encodeURIComponent(dir)}`;
      f.style.cssText = "width:100%;height:110px;border:1px solid #2d3748;border-radius:6px;margin:.2rem 0;background:#161c24";
      $("shards").appendChild(f);
    }
    // Wait for all shards to report ready (timeout 300s)
    const ready = new Array(specs.length).fill(false);
    const readyWait = new Promise((resolve) => {
      const iv = setInterval(() => { if (ready.every(Boolean)) { clearInterval(iv); resolve(); } }, 250);
      setTimeout(() => { clearInterval(iv); resolve(); }, 300000);
    });
    const prevOn = chan.onmessage;
    const log = (s) => { $("shardlog").textContent = s; };
    chan.onmessage = (ev) => {
      const m = ev.data;
      if (m.run !== runId) { prevOn(ev); return; }
      if (m.cmd === "ready" && m.shard != null && m.shard < specs.length) {
        ready[m.shard] = true;
        const seen = ready.filter(Boolean).length;
        log(`shard workers: ${seen}/${specs.length} ready (${m.layers[0]}..${m.layers[1] - 1})…`);
      } else if (m.cmd === "ready-error" && m.shard != null && m.shard < specs.length) {
        log(`shard ${m.shard} FAILED: ${(m.error || "").slice(0, 140)}`);
      }
      prevOn(ev);
    };
    const tR0 = performance.now();
    await readyWait;
    const nReady = ready.filter(Boolean).length;
    if (nReady < specs.length) throw new Error(`only ${nReady}/${specs.length} shard workers became ready`);
    out.stageMs.ready = +(performance.now() - tR0).toFixed(0);
    log(`all ${specs.length} shard workers ready`);
    status(`coordinator: loading embedding + head…`);

    const coord = await gabionLoader.loadCoordinator(manifest, dir + "/coord.f16");
    out.stageMs.load = +(performance.now() - tL0).toFixed(0);
    out.stageMs.ready = 0;
    // Upload the embedding to the coordinator's GPU for the lm_head matmul
    // (cache the transposed head once — the CPU transpose is ~400ms)
    await initCoordGPU();
    if (coordGPU) {
      coord.tokEmb.weight.toGPU();
      coord._headW = coord.tokEmb.weight.transpose2d();
      // Free the untransposed embedding GPU copy — only headW is needed;
      // keeping both (1.09GB) with the shards' weights risks device loss.
      coord.tokEmb.weight.gpuBuffer = null;
      coord.tokEmb.weight._dirty = "cpu";
    } else {
      coord._headW = coord.tokEmb.weight.transpose2d();
    }
    status(`coordinator loaded (${out.model.d_model} dim, 0 layers) — generating…`);

    const maxNew = Math.max(1, Math.min(512, parseInt($("tokens").value, 10) || 64));
    const temp = parseFloat($("temp").value);
    const topK = Math.max(0, parseInt($("topk").value, 10) || 0);
    const topP = parseFloat($("topp").value);
    // Parallel decode: K sampled tokens per pipeline pass (amortizes hop latency)
    const K = Math.max(1, Math.min(16, parseInt($("parallel").value, 10) || 1));
    let rng = null;
    const seedTxt = $("seed").value.trim();
    if (seedTxt !== "") {
      let s = 0;
      for (let i = 0; i < seedTxt.length; i++) s = (Math.imul(31, s) + seedTxt.charCodeAt(i)) | 0;
      rng = () => {
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    let prompt = $("prompt").value;
    if ($("chat").checked && coord.chatTemplate) {
      prompt = "<|im_start|>system\nYou are a helpful assistant.<|im_end|>\n"
             + "<|im_start|>user\n" + prompt + "<|im_end|>\n<|im_start|>assistant\n";
    }
    const ids = coord.tokenize(prompt);
    out.promptTokens = ids.length;

    let stopTokens = [];
    if ($("stop").checked && coord.tokenizer) {
      const v = coord.tokenizer.vocab;
      if (v["<|endoftext|>"] !== undefined) stopTokens.push(v["<|endoftext|>"]);
      if ($("chat").checked && v["<|im_end|>"] !== undefined) stopTokens.push(v["<|im_end|>"]);
    }

    const tailLogits = async (hRow) => {
      const t0l = performance.now();
      const hT = window.tinygradV0.Tensor.fromArray(hRow, [1, 1, coord.D], false);
      const normed = coord.normF.forward(hT);
      const logitsT = normed.reshape([1, coord.D]).matmul(coord._headW);
      const r = Float32Array.from((await logitsT.toCPU()).data);
      out.headMs.push(performance.now() - t0l);
      return r;
    };

    // Prefill: embed the whole prompt, run the shard pipeline once
    const tEmb0 = performance.now();
    const embT = coord.tokEmb.forward(new Int32Array(ids), 1, ids.length);
    const preRows = Float32Array.from((await embT.toCPU()).data);
    out.embedMs.push(performance.now() - tEmb0);
    status(`prefill: ${ids.length} tokens through ${specs.length} shards…`);
    const tPre0 = performance.now();
    const { rows: preOut, hopMs: preHop } = await pipeline(preRows);
    out.stageMs.prefill = performance.now() - tPre0;
    out.hopMs.push(...preHop.map(h => +h.toFixed(1)));
    let lg = await tailLogits(preOut.subarray((ids.length - 1) * coord.D));

    // Decode loop — K tokens per pipeline pass when parallel > 1
    const gen = [];
    let stopped = false;
    const sampleK = (n) => {
      const toks = [];
      let guard = 0;
      while (toks.length < n && guard < 40) {
        guard++;
        const t = coord._sample(lg, temp, topK, topP, rng || undefined);
        if (toks.indexOf(t) === -1) toks.push(t); // distinct continuations
      }
      while (toks.length < n) toks.push(coord._sample(lg, temp, topK, topP, rng || undefined));
      return toks;
    };
    while (gen.length < maxNew) {
      const n = Math.min(K, maxNew - gen.length);
      const toks = sampleK(n);
      const tTok0 = performance.now();
      const tEmb = performance.now();
      const emb = coord.tokEmb.forward(new Int32Array(toks), 1, n);
      const rows = Float32Array.from((await emb.toCPU()).data);
      out.embedMs.push(performance.now() - tEmb);
      const { rows: o, hopMs: hop } = await pipeline(rows);
      out.hopMs.push(...hop.map(h => +h.toFixed(1)));
      lg = await tailLogits(o.subarray((n - 1) * coord.D));
      out.perTokenMs.push(+(performance.now() - tTok0).toFixed(1));
      for (const t of toks) {
        gen.push(t);
        if (stopTokens.indexOf(t) !== -1) { stopped = true; break; }
      }
      if (stopped) break;
      const ms = performance.now() - t0;
      $("stats").textContent = `${gen.length}/${maxNew} tokens · ${(gen.length / (ms / 1000)).toFixed(2)} tok/s (K=${n})`;
    }
    out.stopped = stopped;
    const ms = performance.now() - t0;
    const display = gen.length && stopTokens.indexOf(gen[gen.length - 1]) !== -1 ? gen.slice(0, -1) : gen;
    out.text = coord.tokenizer ? coord.tokenizer.decode(Array.from(display)) : "";
    out.tokenIds = Array.from(gen).slice(0, 64);
    out.generatedTokens = gen.length;
    out.tokPerSec = gen.length / (ms / 1000);
    out.ms = ms;
    $("output").textContent = out.text;
    $("stats").textContent = `${out.generatedTokens} tokens in ${(ms / 1000).toFixed(1)}s · ` +
      `${out.tokPerSec.toFixed(2)} tok/s · ${out.stopped ? "stopped at boundary · " : ""}` +
      `${specs.length} shard tabs · prompt ${out.promptTokens} tok`;
    status("done");
  } catch (e) {
    out.error = String(e && e.stack || e);
    status("error: " + out.error, "err");
    $("output").textContent = out.error;
  }
  setResult();
  busy = false; $("go").disabled = false;
}

$("go").onclick = generate;
const p = new URLSearchParams(location.search);
if (p.get("auto")) {
  for (const [k, v] of [["dir", "dir"], ["prompt", "prompt"], ["tokens", "tokens"], ["temp", "temp"],
                        ["topk", "topk"], ["topp", "topp"], ["seed", "seed"], ["parallel", "parallel"]]) {
    if (p.get(k) !== null) $(v).value = p.get(k);
  }
  const cb = (k, id) => { if (p.get(k) !== null) $(id).checked = p.get(k) === "1"; };
  cb("chat", "chat"); cb("stop", "stop");
  setTimeout(() => generate(), 50);
}
</script>
</body>
</html>
