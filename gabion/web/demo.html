<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gabion demo — llama in your browser tab</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, Consolas, monospace; margin: 2rem auto; max-width: 860px;
         padding: 0 1rem; background: #101418; color: #d7dde4; }
  h1 { font-size: 1.2rem; color: #7fd1ff; }
  .bar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .6rem 0; }
  label { display: flex; gap: .4rem; align-items: center; font-size: .85rem; color: #9fb0bf; }
  input[type=text], textarea { background: #1a2028; color: #d7dde4; border: 1px solid #2d3748;
         border-radius: 6px; padding: .35rem .5rem; font: inherit; }
  input[type=text] { width: 30rem; }
  textarea { width: 100%; height: 3.2rem; resize: vertical; }
  button { background: #1e6fd9; color: #fff; border: 0; border-radius: 6px; padding: .45rem 1.1rem;
         font: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: wait; }
  #status { font-size: .8rem; color: #7fd1ff; min-height: 1.1em; }
  #output { white-space: pre-wrap; word-break: break-word; background: #161c24; border: 1px solid #2d3748;
         border-radius: 8px; padding: .9rem; min-height: 6rem; max-height: 24rem; overflow-y: auto; }
  #stats { font-size: .8rem; color: #8fd98f; }
  .err { color: #ff7d7d !important; }
</style>
</head>
<body>
<h1>gabion demo — a real llama model generating in your tab</h1>
<div class="bar">
  <label>wire <input type="text" id="modelUrl" value="/gabion/web/models/qwen2.5-0.5b.json"></label>
  <label>tokens <input type="text" id="tokens" value="128" style="width:4rem"></label>
  <label>temp <input type="text" id="temp" value="0.7" style="width:4rem"></label>
  <label>top-k <input type="text" id="topk" value="40" style="width:4rem"></label>
  <label>top-p <input type="text" id="topp" value="0.9" style="width:4rem"></label>
  <label>seed <input type="text" id="seed" value="" placeholder="random" style="width:6rem"></label>
</div>
<div class="bar">
  <label><input type="checkbox" id="chat" checked> chat format</label>
  <label><input type="checkbox" id="stop" checked> stop at &lt;|endoftext|&gt;/&lt;|im_end|&gt;</label>
  <label><input type="checkbox" id="binary" checked> binary wire (fast)</label>
  <button id="go">Generate</button>
</div>
<div class="bar">
  <label>prompt</label>
  <textarea id="prompt">Explain what a GPU is in two sentences.</textarea>
</div>
<div id="status">booting…</div>
<div id="output">(generation appears here)</div>
<div id="stats"></div>
<pre id="resultJson" hidden>{}</pre>

<script src="/gabion/web/tinygrad_v0.js?v=4"></script>
<script src="/gabion/web/webgpu_backend.js?v=4"></script>
<script src="/gabion/web/tokenizer.js?v=4"></script>
<script src="/gabion/web/bbt_forward.js?v=4"></script>
<script src="/gabion/web/model_loader.js?v=4"></script>
<script>
"use strict";
// All kernels the engine can dispatch (decode path needs the KV-attention set).
const KERNELS = ["matmul","elementwise","reduce","softmax","rope","batched_matmul","fused_attention","rmsnorm_forward",
  "softmax_backward","rope_backward","batched_transpose","rmsnorm_backward","adam_update","adamw_update",
  "sgd_update","cross_entropy_forward","cross_entropy_backward","embedding_forward","silu_mul",
  "silu_mul_backward","layernorm","layernorm_backward","dropout_fwd","dropout_bwd","conv2d_fwd",
  "conv2d_bwd_dx","conv2d_bwd_dw","conv_bwd_db","convtranspose2d_fwd","convtranspose2d_bwd_dx",
  "convtranspose2d_bwd_dw","batchnorm_stats","batchnorm_fwd","batchnorm_bwd_stats","batchnorm_bwd_dx",
  "affine_channel","affine_channel_bwd_dw","affine_last","affine_last_bwd_dw","lstm_cell","lstm_cell_bwd",
  "lstm_cell_bwd_dx","lstm_cell_bwd_dh","lstm_cell_bwd_dwih","lstm_cell_bwd_dwhh","kv_attention_scores",
  "kv_attention_apply","kv_group_sum"];

const $ = (id) => document.getElementById(id);
const out = { adapter: "", kernels: 0, model: {}, promptTokens: 0, generatedTokens: 0,
              text: "", tokPerSec: 0, ms: 0, error: null };
let busy = false;

function status(s, cls) { $("status").textContent = s; $("status").className = cls || ""; }

function setResult() {
  $("resultJson").textContent = JSON.stringify(out);
  window.__demoResult = out;
}

async function initGPU() {
  if (!navigator.gpu) return null;
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) return null;
  out.adapter = adapter.name + (adapter.info && adapter.info.description ? " | " + adapter.info.description : "");
  const device = await adapter.requestDevice();
  WebGPUBackend.init(device);
  for (const name of KERNELS) {
    const r = await fetch(`/gabion/web/kernels/${name}.wgsl`, { cache: "no-store" });
    if (!r.ok) throw new Error(`kernel ${name}: HTTP ${r.status}`);
    WebGPUBackend.registerShader(name, await r.text());
  }
  out.kernels = KERNELS.length;
  return WebGPUBackend.instance;
}

async function generate() {
  if (busy) return;
  busy = true; $("go").disabled = true;
  $("output").textContent = ""; $("stats").textContent = "";
  out.error = null;
  try {
    const url = $("modelUrl").value.trim() || "/gabion/web/models/qwen2.5-0.5b.json";
    const binary = $("binary").checked;
    const maxNew = Math.max(1, Math.min(512, parseInt($("tokens").value, 10) || 64));
    const temp = parseFloat($("temp").value);
    const topK = Math.max(0, parseInt($("topk").value, 10) || 0);
    const topP = parseFloat($("topp").value);
    const seedTxt = $("seed").value.trim();
    status(binary ? "loading binary wire (model.json + weights.f16)…" : "loading model wire…");
    // Binary wire is the default (33% smaller than base64); auto-detect .json vs .gabion.json
    const isGabionJson = url.endsWith(".gabion.json");
    const model = binary
      ? await gabionLoader.loadBBTModelBin(
          isGabionJson ? url.replace(/\.gabion\.json$/, ".json") : url,
          isGabionJson ? url.replace(/\.gabion\.json$/, ".f16") : url.replace(/\.json$/, ".f16"))
      : await gabionLoader.loadBBTModel(url);
    out.model = { d_model: model.D, n_heads: model.H, kv_heads: model.kvH,
                  n_layers: model.L, vocab: model.V, seq_len: model.T };
    status("model loaded — " + JSON.stringify(out.model));

    let prompt = $("prompt").value;
    if ($("chat").checked && model.chatTemplate) {
      // chatml-style single-turn: system + user + assistant marker. Rendered
      // directly (no jinja) — matches the qwen/llama chat templates in practice.
      prompt = "<|im_start|>system\nYou are a helpful assistant.<|im_end|>\n"
             + "<|im_start|>user\n" + prompt + "<|im_end|>\n<|im_start|>assistant\n";
    }
    const ids = model.tokenize(prompt);
    out.promptTokens = ids.length;
    status(`generating… (${out.model.n_layers} layers, ${maxNew} tokens, ${ids.length} prompt tokens)`);

    // Stop tokens: EOS always; im_end when chat formatting is on.
    let stopTokens = [];
    if ($("stop").checked && model.tokenizer) {
      const v = model.tokenizer.vocab;
      if (v["<|endoftext|>"] !== undefined) stopTokens.push(v["<|endoftext|>"]);
      if ($("chat").checked && v["<|im_end|>"] !== undefined) stopTokens.push(v["<|im_end|>"]);
    }
    // Seeded RNG (mulberry32) for reproducible runs; empty seed = Math.random.
    let rng = null;
    if (seedTxt !== "") {
      let s = 0;
      for (let i = 0; i < seedTxt.length; i++) s = (Math.imul(31, s) + seedTxt.charCodeAt(i)) | 0;
      rng = () => {
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const t0 = performance.now();
    let streamed = "";
    const res = await model.decode(ids, {
      maxNewTokens: maxNew,
      temperature: Number.isFinite(temp) ? temp : 0.8,
      topK,
      topP: Number.isFinite(topP) && topP > 0 ? topP : 0,
      stopTokens,
      rng,
      debugNaN: true,
      onToken: (tok, logits, tokens) => {
        const piece = model.tokenizer ? model.tokenizer.decode([tok]) : "";
        streamed += piece;
        $("output").textContent = streamed;
        const ms = performance.now() - t0;
        const done = tokens.length - ids.length;
        $("stats").textContent = `${done}/${maxNew} tokens · ${(done / (ms / 1000)).toFixed(2)} tok/s · KV pos ${tokens.length - 1}`;
      },
    });
    const ms = performance.now() - t0;
    const gen = res.tokens.slice(ids.length);
    // Trim a trailing stop token from the DISPLAYED text (it stays in tokenIds).
    const display = gen.length && stopTokens.indexOf(gen[gen.length - 1]) !== -1 ? gen.slice(0, -1) : gen;
    out.text = model.tokenizer ? model.tokenizer.decode(Array.from(display)) : "";
    out.stopped = !!res.stopped;
    out.tokenIds = Array.from(gen).slice(0, 64);
    const lg = res.logits && res.logits.length ? res.logits[res.logits.length - 1] : null;
    if (lg) {
      let nan = 0, inf = 0, mx = -Infinity, mn = Infinity;
      for (let i = 0; i < lg.length; i++) {
        const v = lg[i];
        if (Number.isNaN(v)) nan++; else if (!Number.isFinite(v)) inf++;
        else { if (v > mx) mx = v; if (v < mn) mn = v; }
      }
      out.logitStats = { nan, inf, min: mn, max: mx, first: Array.from(lg.slice(0, 6)) };
    }
    out.generatedTokens = gen.length;
    out.tokPerSec = gen.length / (ms / 1000);
    out.ms = ms;
    $("output").textContent = out.text;
    $("stats").textContent = `${out.generatedTokens} tokens in ${(ms / 1000).toFixed(1)}s · ` +
      `${out.tokPerSec.toFixed(2)} tok/s · ${out.stopped ? "stopped at boundary · " : ""}adapter: ${out.adapter || "CPU fallback"} · ` +
      `prompt: ${out.promptTokens} tok`;
    status("done");
  } catch (e) {
    out.error = String(e && e.stack || e);
    status("error: " + out.error, "err");
    $("output").textContent = out.error;
  }
  setResult();
  busy = false; $("go").disabled = false;
}

(async function boot() {
  try { await initGPU(); status(out.adapter ? `WebGPU ready (${out.adapter}), ${out.kernels} kernels` : "WebGPU unavailable — CPU fallback"); }
  catch (e) { status("WebGPU init failed (" + e.message + ") — CPU fallback"); }
  $("go").onclick = generate;
  const p = new URLSearchParams(location.search);
  if (p.get("mode") === "ref") {
    // diagnostic: GPU forward on the full prompt, last-row logits only
    try {
      const url = $("modelUrl").value.trim() || "/gabion/web/models/qwen2.5-0.5b.json";
      const binary = p.get("binary") !== "0";
      const isGabionJson = url.endsWith(".gabion.json");
      const model = binary
        ? await gabionLoader.loadBBTModelBin(
            isGabionJson ? url.replace(/\.gabion\.json$/, ".json") : url,
            isGabionJson ? url.replace(/\.gabion\.json$/, ".f16") : url.replace(/\.json$/, ".f16"))
        : await gabionLoader.loadBBTModel(url);
      let prompt = p.get("prompt") || "The capital of France is";
      if (model.chatTemplate) {
        prompt = "<|im_start|>system\nYou are a helpful assistant.<|im_end|>\n<|im_start|>user\n" + prompt + "<|im_end|>\n<|im_start|>assistant\n";
      }
      const ids = model.tokenize(prompt);
      const t0 = performance.now();
      const fwd = await model.forward(new Int32Array(ids), 1, ids.length);
      const ms = performance.now() - t0;
      const lg = fwd.data.subarray((ids.length - 1) * model.V, ids.length * model.V);
      const top = Array.from({ length: model.V }, (_, i) => i).sort((a, b) => lg[b] - lg[a]).slice(0, 8);
      out.refForward = {
        promptTokens: ids.length, ms,
        topIds: top,
        topText: top.map(i => model.tokenizer.decode([i])),
        logit: { min: lg[0], max: lg[0] },
      };
      for (let i = 1; i < lg.length; i++) { if (lg[i] < out.refForward.logit.min) out.refForward.logit.min = lg[i]; if (lg[i] > out.refForward.logit.max) out.refForward.logit.max = lg[i]; }
      status("ref forward done");
    } catch (e) {
      out.error = String(e && e.stack || e);
      status("ref error: " + out.error, "err");
    }
    setResult();
    return;
  }
  if (p.get("auto")) {
    if (p.get("model")) $("modelUrl").value = p.get("model");
    if (p.get("prompt") != null) $("prompt").value = p.get("prompt");
    if (p.get("tokens")) $("tokens").value = p.get("tokens");
    if (p.get("temp")) $("temp").value = p.get("temp");
    if (p.get("topk")) $("topk").value = p.get("topk");
    if (p.get("topp")) $("topp").value = p.get("topp");
    if (p.get("seed")) $("seed").value = p.get("seed");
    if (p.get("chat") === "0") $("chat").checked = false;
    if (p.get("stop") === "0") $("stop").checked = false;
    if (p.get("binary") === "0") $("binary").checked = false;
    await generate();
  }
})();
</script>
</body>
</html>
